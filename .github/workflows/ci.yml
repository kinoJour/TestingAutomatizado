name: .NET Framework CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest 

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Configurar NuGet
      uses: nuget/setup-nuget@v2

    # NUEVO PASO CRUCIAL: Agrega las herramientas de Visual Studio (como vstest) al entorno
    - name: Configurar Herramientas de Prueba de Visual Studio
      uses: darenm/Setup-VSTest@v1.2

    - name: Restaurar Paquetes NuGet
      run: nuget restore TestingAutomatizado.sln

    - name: Compilar Solucion (Debug)
      run: msbuild TestingAutomatizado.sln /p:Configuration=Debug /p:Platform="Any CPU"

    - name: Ejecutar Pruebas con VSTest
      # Ahora la máquina sabrá exactamente qué es vstest.console.exe gracias al paso de arriba
      run: vstest.console.exe Prime.Services.Tests\bin\Debug\Prime.Services.Tests.dll